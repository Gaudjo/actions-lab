name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:

    echo-message:
        runs-on: ubuntu-latest

        steps:
            - name: Allow me to re-introduce myself
              run: echo "Hello, Actions!"

            - name: Spill the beans
              run: $THE_SUPER_SECRET

    test:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: ['18', '20']

        steps:
            - name: check out code
              uses: actions/checkout@v6

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                node-version: ${{ matrix.node-version }}

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

            - name: Set up Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                node-version: ${{ matrix.node-version }}
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test